# ───────────────────────── Font ─────────────────────────
font_family       JetBrainsMono Nerd Font Mono
bold_font         auto
italic_font       auto
bold_italic_font  auto
font_size         12.0
# ligatures on, but plain text under the cursor
disable_ligatures cursor
# crisper, bolder-looking text over transparent backgrounds
text_composition_strategy 1.0 30

# ───────────────────────── Window ───────────────────────
window_padding_width        6
background_opacity          0.35
dynamic_background_opacity  yes
background_blur             32
hide_window_decorations     yes
initial_window_width        110c
initial_window_height       32c
# ask only when a program (not just the shell) is running
confirm_os_window_close     -1
enable_audio_bell           no
window_alert_on_bell        yes
# dim the unfocused split so the active one stands out
inactive_text_alpha         0.78
window_border_width         1pt
draw_minimal_borders        yes
active_border_color         #1793d1
inactive_border_color       #414868

# ───────────────────────── Cursor ───────────────────────
cursor_shape          block
cursor_blink_interval 0
# soft trail when the cursor jumps
cursor_trail          0
cursor_trail_decay    0.12 0.4
mouse_hide_wait       3.0

# ───────────────────────── Scrollback ───────────────────
scrollback_lines 20000
wheel_scroll_multiplier 3.0

# ───────────────────────── Behaviour ────────────────────
copy_on_select          yes
strip_trailing_spaces   smart
shell_integration       enabled
enabled_layouts         splits,stack
allow_remote_control    no
update_check_interval   0

# ───────────────────────── Tabs ─────────────────────────
tab_bar_style           powerline
tab_powerline_style     round
tab_bar_align           left
# no tab bar until you open a second tab
tab_bar_min_tabs        2
tab_title_template      "{index}: {title}"
active_tab_font_style   bold

# ───────────────────────── Links ────────────────────────
# Ctrl+click opens the URL under the pointer in the default browser (xdg-open)
detect_urls      yes
open_url_with    default
url_style        curly
mouse_map ctrl+left release grabbed,ungrabbed mouse_handle_click link
mouse_map ctrl+left press grabbed discard_event

# ───────────────────────── Keys ─────────────────────────
# new windows / tabs open in the current directory
map ctrl+shift+n new_os_window_with_cwd
map ctrl+t       new_tab_with_cwd
map ctrl+shift+t new_tab_with_cwd

# splits: Ctrl+Shift+\  side by side, Ctrl+Shift+-  stacked, Ctrl+Shift+Z  zoom one split
map ctrl+shift+backslash launch --location=vsplit --cwd=current
map ctrl+shift+minus     launch --location=hsplit --cwd=current
map ctrl+shift+z         toggle_layout stack
map ctrl+shift+left      neighboring_window left
map ctrl+shift+right     neighboring_window right
map ctrl+shift+up        neighboring_window up
map ctrl+shift+down      neighboring_window down

# font size
map ctrl+plus  change_font_size all +1.0
map ctrl+minus change_font_size all -1.0
map ctrl+0     change_font_size all 0

# jump between shell prompts (needs shell integration)
map ctrl+alt+up   scroll_to_prompt -1
map ctrl+alt+down scroll_to_prompt 1

# ───────────────────────── Colours ──────────────────────
foreground            #eef1ff
background            #0c0d16
selection_foreground  #11131a
selection_background  #ffffff
cursor                #1793d1
cursor_text_color     #ffffff
url_color             #7fd0ff
active_tab_foreground    #1a1b26
active_tab_background    #1793d1
inactive_tab_foreground  #787c99
inactive_tab_background  #24283b
tab_bar_background       #1a1b26

