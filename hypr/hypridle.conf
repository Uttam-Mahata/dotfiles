general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })' && nmcli radio wifi on
}

listener {   # dim screen after 4 min
    timeout = 240
    on-timeout = brightnessctl -s set 10%
    on-resume = brightnessctl -r
}

listener {   # lock after 5 min
    timeout = 300
    on-timeout = loginctl lock-session
}

listener {   # screen off after 6 min (saves power while keeping Wi-Fi & background tasks alive)
    timeout = 360
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "off" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}

# Suspend listener is disabled so the device remains connected to Wi-Fi while idle/locked.
# True system suspend (S3/s2idle) halts the CPU and shuts off wireless hardware.
# Screen off (DPMS) above achieves low-power idle without cutting Wi-Fi.
# listener {   # suspend after 15 min
#     timeout = 900
#     on-timeout = systemctl suspend
# }
