# ========================================================
# HYPRLOCK - ARCH LINUX ACCENT THEME (#1793d1 & #222222)
# Managed in ~/projects/dotfiles/hypr/hyprlock.conf
# ========================================================

general {
    disable_loading_bar = true
    hide_cursor = true
    grace = 0
    no_fade_in = false
}

# 1. BACKGROUND
background {
    monitor =
    path = /home/uttam/Pictures/Wallpapers/current.jpg
    # Alternative: uncomment below to blur the current desktop screenshot
    # path = screenshot
    color = rgba(26, 27, 38, 1.0)

    # Frosted blur
    blur_passes = 3
    blur_size = 7
    noise = 0.015
    contrast = 0.95
    brightness = 0.75
}

# 2. ARCH LINUX LOGO
image {
    monitor =
    path = /usr/share/pixmaps/archlinux-logo.png
    size = 90
    rounding = 0
    border_size = 0
    position = 0, 230
    halign = center
    valign = center
}

# 3. TIME / CLOCK
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = rgba(242, 242, 242, 1.0)
    font_size = 78
    font_family = Noto Sans Bold
    position = 0, 125
    halign = center
    valign = center
}

# 4. DATE
label {
    monitor =
    text = cmd[update:60000] echo "$(date +"%A, %d %B %Y")"
    color = rgba(140, 150, 160, 0.9)
    font_size = 18
    font_family = Noto Sans
    position = 0, 65
    halign = center
    valign = center
}

# 5. USER GREETING
label {
    monitor =
    text = $USER@archlinux
    color = rgba(23, 147, 209, 0.95)
    font_size = 15
    font_family = Noto Sans Medium
    position = 0, 15
    halign = center
    valign = center
}

# 6. PASSWORD INPUT FIELD
input-field {
    monitor =
    size = 280, 50
    outline_thickness = 2
    dots_size = 0.28
    dots_spacing = 0.25
    dots_center = true

    round_corners = 12
    outer_color = rgba(23, 147, 209, 0.9) rgba(79, 180, 232, 0.8) 45deg
    inner_color = rgba(34, 34, 34, 0.85)
    font_color = rgb(242, 242, 242)

    fade_on_empty = false
    placeholder_text = <span foreground="##8c96a0">Password…</span>
    hide_input = false
    font_family = Noto Sans

    # Status feedback
    check_color = rgb(23, 147, 209)
    fail_color = rgb(224, 85, 85)
    fail_text = <i>Authentication failed ($ATTEMPTS)</i>

    position = 0, -45
    halign = center
    valign = center
}
